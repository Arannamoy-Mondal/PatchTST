experiment: v4.0
parent: v2.0
parent_run: artifacts/runs/20261012T183328Z_f-all_cead14cc32f1
base_config: config/base.yaml
proposal: Detecting Parkinson's Disease from Speech PP.pdf
report_template: docs/patchtst_technical_report_v1_2.pdf
replaces_official_result: false

features:
  model: microsoft/wavlm-large
  revision: c1423ed94bb01d80a3f5ce5bc39f6026a0f4828c
  hidden_size: 1024
  seconds: 10.0
  minimum_samples: 400
  normalization: pretrained_mean_variance
  pooling: last_hidden_state_mean_then_equal_window_mean
  dtype: float32
  device: cpu
  threads: 4
  workers: 4
  version: frozen-wavlm-large-v1

classifiers:
  logistic_regression:
    C: [0.01, 0.1, 1.0, 10.0]
  random_forest:
    n_estimators: [300]
    max_depth: [4, null]
    min_samples_leaf: [1, 2]
    max_features: [sqrt]
  xgboost:
    n_estimators: [200]
    max_depth: [1, 2, 3]
    learning_rate: [0.03, 0.1]
    subsample: [1.0]
    colsample_bytree: [0.5]
    reg_lambda: [1.0]

fine_tuning:
  trigger_auroc: 0.80
  trigger_source: selected_logistic_mean_inner_speaker_auroc
  upper_layers: [2, 4]
  learning_rate: [0.00001, 0.00003]
  epochs: 6
  patience: 2
  validation_fraction: 0.2
  max_windows_per_file: 2
  batch_size: 1
  weight_decay: 0.0001
  dropout: 0.1

outputs:
  cache_root: data/experiments/v4_0_wavlm
  run_root: artifacts/runs
